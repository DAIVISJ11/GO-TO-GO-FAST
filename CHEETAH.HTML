<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSITIONING</title>
    <style>
    div{
        border:5px solid red ;
        color: blue;
    }
    body{
        background-color: rgb(226, 208, 43);
    }
    .STICKY{
        position: sticky;
        top: 0;
        right: 20 px;
        width: 300px;
        border: 5px solid rgb(0, 255, 21);
    }
     .FIXED{
        position:fixed;
        top: 190px;
        right: 20 px;
        width: 300px;
        border: 5px solid rgb(0, 17, 255);
    }
    .RELATIVE{
        position:relative;
        top: 160px;
        right: 20 px;
        width: 300px;
        border: 5px solid rgb(208, 255, 0);
    }
    .ABSOLUTE{
        position:absolute;
        top: 222px;
        right: 20 px;
        width: 300px;
        border: 5px solid rgb(0, 247, 255);
    }
     .STATIC{
        position:static;
        top: 333px;
        right: 20 px;
        width: 300px;
        border: 5px solid rgb(255, 102, 0);
    }
    </style>
</head>
<body>
   <H1><center>POSITIONING</center></H1> 
   
   <Div class="STICKY">
    WITH STICKY ELEMENT
   </Div>  <br><br><br>
   <Div class="RELATIVE">
    WITH RELATIVE ELEMENT
   </Div><br><br><br>
   <Div class="ABSOLUTE"> 
    WITH ABSOLUTE ELEMENT
    </Div><br><br><br>
   <DIv class="STATIC">
    WITH STATIC ELEMENT
   </DIv><br><br><br>
   <Div class="FIXED"> 
    WITH FIXED ELEMENT
   </Div><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
